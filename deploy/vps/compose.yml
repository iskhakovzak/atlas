services:
  web:
    image: atlas-web:20261031b
    container_name: atlas-web
    restart: unless-stopped
    init: true
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: [127.0.0.1:18792:3000]
    volumes:
      - /opt/atlas/data:/atlas-data
      - /opt/atlas/config/environment.json:/run/atlas/environment.json:ro
    networks: [edge]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  edge:
    external: true
    name: prop-deskos_default
